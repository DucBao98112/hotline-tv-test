plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.21-1.0.16'
    id 'com.google.gms.google-services'
}

def ValString = "String"
def ApkName = "ApkName"
def AuthAppId = "AuthAppId"
def FirebaseAppId = "FirebaseAppId"
def FirestoreCollection = "FirestoreCollection"
def BaseServerUrl = "BaseServerUrl"
def ServerUrlPath = "ServerUrlPath"
def ServiceMailAccount = "ServiceMailAccount"
def ServiceMailHost = "ServiceMailHost"
def AppDomain = "AppDomain"
def DatabaseName = "DatabaseName"

android {
    namespace "com.gc.waravi"
    defaultConfig {
        applicationId "com.gc.tsukushitv.v2"
        compileSdk 34
        targetSdkVersion 34
        minSdkVersion 24
        versionCode 16
        versionName "1.0.7.4"
    }
    signingConfigs{
        debug {
            storeFile file('debug.keystore')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
        }
        release {
            storeFile file("hotline-keystore.jks")
            storePassword "hotline2023"
            keyAlias "hotline-upload"
            keyPassword "hotline2023"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    flavorDimensions = ["product", "kind"]
    productFlavors {
        hotline {
            applicationId 'com.gc.hotline.v2'
            dimension "product"
            isDefault true
            resValue "string", "app_name", "HOTLINE TV+"
            buildConfigField(ValString, ApkName, "\"hotline_v2.apk\"")
            buildConfigField(ValString, AuthAppId, "\"hotline\"")
            buildConfigField(ValString, FirebaseAppId, "\"hotline-tv-e25fc\"")
            buildConfigField(ValString, FirestoreCollection, "\"hotline-v2\"")
            buildConfigField(ValString, BaseServerUrl, "\"https://bot.atpop.info\"")
            buildConfigField(ValString, ServerUrlPath, "\"skyway-v2\"")
            buildConfigField(ValString, AppDomain, "\"hotline.ne.jp\"")
            buildConfigField(ValString, ServiceMailAccount, "\"hotlinetv2025\"")
            buildConfigField(ValString, ServiceMailHost, "\"medionlink.com\"")
            buildConfigField(ValString, DatabaseName, "\"HOTLINE TV+_db\"")
        }
        waravi {
            applicationId 'com.gc.waravi.v2'
            dimension "product"
            resValue "string", "app_name", "Waravi"
            buildConfigField(ValString, ApkName, "\"waravi_v2.apk\"")
            buildConfigField(ValString, AuthAppId, "\"waravi\"")
            buildConfigField(ValString, FirebaseAppId, "\"waravi-40bb4\"")
            buildConfigField(ValString, FirestoreCollection, "\"waravi-v2\"")
            buildConfigField(ValString, BaseServerUrl, "\"https://bot.atpop.info\"")
            buildConfigField(ValString, ServerUrlPath, "\"waravi-v2\"")
            buildConfigField(ValString, AppDomain, "\"bot.atpop.info\"")
            buildConfigField(ValString, ServiceMailAccount, "\"waraviplus2025\"")
            buildConfigField(ValString, ServiceMailHost, "\"medionlink.com\"")
            buildConfigField(ValString, DatabaseName, "\"Waravi_db\"")
        }
        hotlineOrig {
            applicationId 'com.gc.hotline'
            versionCode 30
            versionName "3.0.1"
            dimension "product"
            resValue "string", "app_name", "HOTLINE TV+"
            buildConfigField(ValString, ApkName, "\"hotline_tv.apk\"")
            buildConfigField(ValString, AuthAppId, "\"hotline\"")
            buildConfigField(ValString, FirebaseAppId, "\"hotline-tv-e25fc\"")
            buildConfigField(ValString, FirestoreCollection, "\"hotlineData\"")
            buildConfigField(ValString, BaseServerUrl, "\"https://bot.atpop.info\"")
            buildConfigField(ValString, ServerUrlPath, "\"skyway-v2\"")
            buildConfigField(ValString, AppDomain, "\"hotline.ne.jp\"")
            buildConfigField(ValString, ServiceMailAccount, "\"hotlinetv2025\"")
            buildConfigField(ValString, ServiceMailHost, "\"medionlink.com\"")
            buildConfigField(ValString, DatabaseName, "\"Hotline TV_db\"")
        }
        hotlineStore {
            applicationId 'jp.ne.hotline'
            versionCode 32
            versionName "3.0.1"
            dimension "product"
            resValue "string", "app_name", "HOTLINE TV+"
            buildConfigField(ValString, ApkName, "\"hotline_tv.apk\"")
            buildConfigField(ValString, AuthAppId, "\"hotline\"")
            buildConfigField(ValString, FirebaseAppId, "\"hotline-tv-e25fc\"")
            buildConfigField(ValString, FirestoreCollection, "\"hotlineData\"")
            buildConfigField(ValString, BaseServerUrl, "\"https://bot.atpop.info\"")
            buildConfigField(ValString, ServerUrlPath, "\"skyway-v2\"")
            buildConfigField(ValString, AppDomain, "\"hotline.ne.jp\"")
            buildConfigField(ValString, ServiceMailAccount, "\"hotlinetv2025\"")
            buildConfigField(ValString, ServiceMailHost, "\"medionlink.com\"")
            buildConfigField(ValString, DatabaseName, "\"Hotline TV_db\"")
        }

        normal {
            dimension "kind"
            isDefault true
        }

        auth {
            dimension "kind"
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/INDEX.LIST'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/NOTICE.md'
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def baseName = variant.baseName
            def versionName = variant.versionName
            outputFileName = "${baseName}-plus-${versionName}.apk"
        }
    }
}

dependencies {
    def roomVersion = "2.6.1"
    def lifecycle_version = "2.8.6"

    // Skyway
    implementation 'com.ntt.skyway:room:3.7.2'
    implementation 'com.ntt.skyway:video-processors:1.0.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.media:media:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.3'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation("androidx.leanback:leanback:1.2.0-alpha04")
    implementation "androidx.leanback:leanback-tab:1.1.0-beta01"

    implementation("androidx.room:room-runtime:$roomVersion")
    implementation("androidx.room:room-ktx:$roomVersion")
    annotationProcessor("androidx.room:room-compiler:$roomVersion")
    ksp("androidx.room:room-compiler:$roomVersion")

    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version")
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.0-alpha03'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    implementation(platform("com.google.firebase:firebase-bom:33.3.0"))
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation("com.squareup.okhttp3:okhttp:4.10.0")

    implementation 'com.google.auth:google-auth-library-oauth2-http:1.24.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    //Socket IO
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation files('libs/libuvccamera.aar')

    /* AndroidMail(JavaMail for Android) */
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    /* jsoup */
    implementation "org.jsoup:jsoup:1.13.1"
}